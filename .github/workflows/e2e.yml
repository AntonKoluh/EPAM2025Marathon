# .github/workflows/frontend-e2e.yml
name: Frontend E2E BDD deleteUser

on:
  push:
    branches: [main, staging]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-e2e.yml'
  pull_request:
    branches: [main, staging]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: frontend-e2e-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # --- Option A: run against local preview (Vite) ---
      - name: Build app
        run: npm run build

      - name: Run BDD (start preview, wait, test)
        env:
          BASE_URL: http://localhost:5173
        run: npm run ci

      - name: Generate HTML report
        if: always()
        run: npm run report

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-reports
          # paths are repo-root relative (not affected by defaults.run)
          path: |
            frontend/reports/
            frontend/reports/cucumber.json
