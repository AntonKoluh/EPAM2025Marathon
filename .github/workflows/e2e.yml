name: E2E BDD

on:
  push:
    branches: [ staging, main ]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        
      - name: Build app
        run: npm run build

      - name: Run BDD (start preview, wait, test)
        env:
          BASE_URL: http://localhost:5173
        run: npm run ci

      - name: Generate HTML report
        if: always()
        run: npm run report

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-bdd-reports
          path: |
            reports/
            reports/cucumber.json
