name: DeleteUser (Deployed)

on:
  push:
    branches: [main, staging]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-e2e.yml'
  pull_request:
    branches: [main, staging]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: frontend-e2e-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run BDD against deployed URL
        env:
          BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: npx cucumber-js -p default

      - name: Generate HTML report
        if: always()
        run: npm run report

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-reports
          path: |
            frontend/reports/
            frontend/reports/cucumber.json
